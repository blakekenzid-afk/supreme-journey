<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Command Center</title>
    <script>
        const allowedPages = new Set(['dashboard.html']);
        const storedLandingPage = localStorage.getItem('teacherstack-landing-page') || 'dashboard.html';
        const landingPage = allowedPages.has(storedLandingPage) ? storedLandingPage : 'dashboard.html';
        window.location.replace(landingPage);
    </script>
</head>
<body>
    <p>Redirecting to <a href="dashboard.html">dashboard.html</a>...</p>
</body>
</html>
