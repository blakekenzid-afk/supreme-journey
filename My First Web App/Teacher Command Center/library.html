<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacherstack - Library</title>
    <link rel="stylesheet" href="dashboard.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .lib-wrap { display:flex;flex-direction:column;height:100%;overflow:hidden; }
        .lib-header { display:flex;align-items:center;justify-content:space-between;padding:20px 24px 12px;flex-wrap:wrap;gap:10px; }
        .lib-title { font-size:1.4rem;font-weight:700;color:#222;display:flex;align-items:center;gap:10px; }
        .lib-btn { display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border:none;border-radius:10px;font-family:inherit;font-size:0.88rem;font-weight:600;cursor:pointer;transition:background 0.15s; }
        .lib-btn.primary { background:#6366f1;color:#fff; }
        .lib-btn.primary:hover { background:#4f46e5; }
        .lib-btn.secondary { background:#f3f4f6;color:#555; }
        .lib-btn.secondary:hover { background:#e5e7eb; }
        .lib-btn.danger { background:#fee2e2;color:#dc2626; }

        .lib-body { flex:1;overflow-y:auto;padding:0 24px 24px; }

        /* Category sections */
        .lib-section { margin-bottom:28px; }
        .lib-section-header { display:flex;align-items:center;justify-content:space-between;margin-bottom:10px; }
        .lib-section-title { font-size:0.82rem;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:8px; }
        .lib-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px; }

        .lib-card { background:#fff;border-radius:14px;border:1.5px solid #e0e0e0;padding:14px 16px;display:flex;align-items:flex-start;gap:12px;transition:box-shadow 0.15s,border-color 0.15s;position:relative; }
        .lib-card:hover { box-shadow:0 4px 14px rgba(0,0,0,0.09);border-color:#c7d2fe; }
        .lib-fav-icon { width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;background:#ede9fe; }
        .lib-info { flex:1;min-width:0; }
        .lib-name { font-size:0.88rem;font-weight:700;color:#222;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
        .lib-url { font-size:0.74rem;color:#6366f1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px; }
        .lib-desc { font-size:0.75rem;color:#888;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden; }
        .lib-card-actions { display:flex;gap:4px;flex-shrink:0;flex-direction:column; }
        .icon-btn { background:none;border:none;cursor:pointer;color:#bbb;font-size:0.85rem;padding:5px;border-radius:7px;transition:color 0.15s,background 0.15s; }
        .icon-btn:hover { color:#6366f1;background:#ede9fe; }
        .icon-btn.red:hover { color:#dc2626;background:#fee2e2; }

        .empty-state { display:flex;flex-direction:column;align-items:center;justify-content:center;color:#bbb;gap:12px;padding:60px 20px; }
        .empty-state i { font-size:3rem;opacity:0.35; }
        .empty-state p { font-size:0.9rem;text-align:center; }

        .main-content { overflow-y:auto; }

        /* Modal */
        .lm-overlay { display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:2000;align-items:center;justify-content:center; }
        .lm-box { background:#fff;border-radius:18px;padding:0;width:460px;max-width:96vw;display:flex;flex-direction:column;box-shadow:0 24px 48px rgba(0,0,0,0.22);overflow:hidden; }
        .lm-header { padding:20px 24px;border-bottom:1.5px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between; }
        .lm-body { padding:20px 24px;display:flex;flex-direction:column;gap:12px; }
        .lm-footer { padding:16px 24px;border-top:1.5px solid #f0f0f0;display:flex;gap:8px;justify-content:flex-end; }
        .lm-label { font-size:0.78rem;color:#888;display:block;margin-bottom:4px;font-weight:500; }
        .lm-input { width:100%;box-sizing:border-box;padding:10px 12px;border:1.5px solid #e0e0e0;border-radius:10px;font-family:inherit;font-size:0.9rem;outline:none; }
        .lm-input:focus { border-color:#6366f1; }
        textarea.lm-input { resize:vertical;min-height:70px; }

        .cat-picker { display:flex;flex-wrap:wrap;gap:6px; }
        .cat-btn { padding:5px 12px;border-radius:8px;border:2px solid #e0e0e0;font-size:0.78rem;font-weight:600;cursor:pointer;transition:all 0.12s;background:#f5f5f5;color:#555; }
        .cat-btn.selected { background:#ede9fe;color:#6366f1;border-color:#6366f1; }

        /* Search bar */
        .lib-search { display:flex;align-items:center;gap:10px;padding:0 24px 14px; }
        .lib-search-input { flex:1;padding:9px 14px;border:1.5px solid #e0e0e0;border-radius:10px;font-family:inherit;font-size:0.88rem;outline:none; }
        .lib-search-input:focus { border-color:#6366f1; }
    </style>
</head>
<body>
<div class="app-container">
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="profile-icon">R</div>
            <div class="class-info">
                <span class="class-name">Regulation Sta...</span>
                <span class="grade">Grade K</span>
            </div>
            <i class="fa-solid fa-chevron-down toggle-icon"></i>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-table-columns"></i><span>Dashboard</span></a>
            <a href="attendance.html" class="nav-item"><i class="fa-solid fa-user-check"></i><span>Attendance</span></a>
            <a href="whiteboard.html" class="nav-item"><i class="fa-solid fa-display"></i><span>Display Tools</span></a>
            <a href="students.html" class="nav-item"><i class="fa-solid fa-users"></i><span>Students</span></a>
            <div class="nav-section">PLANNING</div>
            <a href="planner.html" class="nav-item"><i class="fa-solid fa-calendar-days"></i><span>Planner</span></a>
            <a href="lessons.html" class="nav-item"><i class="fa-solid fa-book-open"></i><span>Lessons</span></a>
            <a href="library.html" class="nav-item active"><i class="fa-solid fa-bookmark"></i><span>Library</span></a>
        </nav>
        <div class="sidebar-footer user-profile">
            <div class="user-avatar">T</div>
            <div class="user-info">
                <span class="user-name">Kenzi Young</span>
                <span class="user-email">kenzi@gmail.com</span>
            </div>
            <i class="fa-solid fa-chevron-up"></i>
        </div>
    </aside>

    <main class="main-content light-bg">
        <header class="top-nav">
            <div class="nav-left">
                <i class="fa-solid fa-bars menu-toggle"></i>
                <span class="brand-name">Teacherstack</span>
            </div>
        </header>

        <div class="lib-wrap">
            <div class="lib-header">
                <div class="lib-title"><i class="fa-solid fa-bookmark" style="color:#6366f1;"></i> Resource Library</div>
                <button class="lib-btn primary" onclick="openAddModal()"><i class="fa-solid fa-plus"></i> Add Resource</button>
            </div>
            <div class="lib-search">
                <input id="lib-search" class="lib-search-input" type="text" placeholder="Search resources..." oninput="renderLibrary()">
            </div>
            <div class="lib-body" id="lib-body"></div>
        </div>
    </main>
</div>

<!-- Add / Edit Modal -->
<div id="lib-modal" class="lm-overlay" onclick="if(event.target===this)closeLibModal()">
    <div class="lm-box">
        <div class="lm-header">
            <span style="font-size:1.05rem;font-weight:700;"><i class="fa-solid fa-bookmark" style="color:#6366f1;margin-right:8px;"></i><span id="lib-modal-title">Add Resource</span></span>
            <button onclick="closeLibModal()" style="background:none;border:none;cursor:pointer;font-size:1.2rem;color:#aaa;">✕</button>
        </div>
        <div class="lm-body">
            <div>
                <label class="lm-label">Name *</label>
                <input id="lib-name" class="lm-input" type="text" placeholder="e.g. Starfall Reading">
            </div>
            <div>
                <label class="lm-label">URL</label>
                <input id="lib-url" class="lm-input" type="url" placeholder="https://...">
            </div>
            <div>
                <label class="lm-label">Description</label>
                <textarea id="lib-desc-input" class="lm-input" placeholder="What is this resource for?"></textarea>
            </div>
            <div>
                <label class="lm-label">Category</label>
                <div class="cat-picker" id="lib-cat-picker"></div>
            </div>
        </div>
        <div class="lm-footer">
            <button id="lib-delete-btn" class="lib-btn danger" style="display:none;margin-right:auto;" onclick="deleteResourceConfirm()"><i class="fa-solid fa-trash"></i> Delete</button>
            <button class="lib-btn secondary" onclick="closeLibModal()">Cancel</button>
            <button class="lib-btn primary" onclick="saveResource()"><i class="fa-solid fa-floppy-disk"></i> Save</button>
        </div>
    </div>
</div>

<script>
    const CATEGORIES = [
        {key:'reading',label:'Reading',icon:'📖'},
        {key:'math',label:'Math',icon:'🔢'},
        {key:'science',label:'Science',icon:'🔬'},
        {key:'games',label:'Games',icon:'🎮'},
        {key:'videos',label:'Videos',icon:'🎬'},
        {key:'tools',label:'Tools',icon:'🛠️'},
        {key:'printables',label:'Printables',icon:'🖨️'},
        {key:'other',label:'Other',icon:'📁'},
    ];

    (function applyShellSettings() {
        const className = localStorage.getItem('dash-class-name');
        const grade = localStorage.getItem('dash-grade');
        const teacher = localStorage.getItem('dash-teacher');
        const email = localStorage.getItem('dash-email');

        if (className) document.querySelectorAll('.class-name').forEach(el => el.textContent = className);
        if (grade) document.querySelectorAll('.grade').forEach(el => el.textContent = grade);
        if (teacher) document.querySelectorAll('.user-name').forEach(el => el.textContent = teacher);
        if (email) document.querySelectorAll('.user-email').forEach(el => el.textContent = email);
    })();

    // Preloaded starter resources
    const STARTER_RESOURCES = [
        {id:'s1',name:'Starfall',url:'https://www.starfall.com',desc:'Free phonics and reading games for K-2.',category:'reading',created:new Date().toISOString()},
        {id:'s2',name:'ABCmouse',url:'https://www.abcmouse.com',desc:'Educational activities for ages 2-8.',category:'reading',created:new Date().toISOString()},
        {id:'s3',name:'Khan Academy Kids',url:'https://www.khanacademy.org/kids',desc:'Free math, reading, and more for early learners.',category:'math',created:new Date().toISOString()},
        {id:'s4',name:'Coolmath Games',url:'https://www.coolmathgames.com',desc:'Math-based logic games for kids.',category:'games',created:new Date().toISOString()},
        {id:'s5',name:'Scratch Jr',url:'https://www.scratchjr.org',desc:'Coding and storytelling for young kids.',category:'tools',created:new Date().toISOString()},
        {id:'s6',name:'PBS Kids',url:'https://pbskids.org',desc:'Educational games and videos.',category:'videos',created:new Date().toISOString()},
        {id:'s7',name:'Teachers Pay Teachers',url:'https://www.teacherspayteachers.com',desc:'Free & paid printables and lesson plans.',category:'printables',created:new Date().toISOString()},
        {id:'s8',name:'National Geographic Kids',url:'https://kids.nationalgeographic.com',desc:'Science and nature articles for kids.',category:'science',created:new Date().toISOString()},
    ];

    let resources = JSON.parse(localStorage.getItem('teacherstack-library') || 'null');
    if (!resources) {
        resources = STARTER_RESOURCES;
        saveResources();
    }
    let editingId = null;
    let selectedCat = '';

    function saveResources() { localStorage.setItem('teacherstack-library', JSON.stringify(resources)); }

    function catInfo(key) { return CATEGORIES.find(c => c.key === key) || {label:'Other',icon:'📁'}; }

    function normalizeResourceUrl(url) {
        const trimmedUrl = (url || '').trim();
        if (!trimmedUrl) return '';
        if (/^[a-z][a-z0-9+.-]*:/i.test(trimmedUrl)) return trimmedUrl;
        return 'https://' + trimmedUrl;
    }

    function openResourceUrl(url) {
        const normalizedUrl = normalizeResourceUrl(url);
        if (!normalizedUrl) return;
        window.open(normalizedUrl, '_blank', 'noopener,noreferrer');
    }

    function renderLibrary() {
        const body = document.getElementById('lib-body');
        const q = document.getElementById('lib-search').value.toLowerCase().trim();
        const list = q ? resources.filter(r => r.name.toLowerCase().includes(q) || (r.desc||'').toLowerCase().includes(q) || (r.url||'').toLowerCase().includes(q)) : resources;

        if (list.length === 0) {
            body.innerHTML = `<div class="empty-state"><i class="fa-solid fa-bookmark"></i><p>${q ? 'No resources match your search.' : 'No resources yet — click <strong>Add Resource</strong> to start building your library.'}</p></div>`;
            return;
        }

        // Group by category
        const grouped = {};
        list.forEach(r => {
            const c = r.category || 'other';
            if (!grouped[c]) grouped[c] = [];
            grouped[c].push(r);
        });

        body.innerHTML = '';
        CATEGORIES.forEach(cat => {
            if (!grouped[cat.key]) return;
            const section = document.createElement('div');
            section.className = 'lib-section';
            section.innerHTML = `
                <div class="lib-section-header">
                    <div class="lib-section-title">${cat.icon} ${cat.label}</div>
                </div>
                <div class="lib-grid" id="lib-grid-${cat.key}"></div>
            `;
            body.appendChild(section);
            const grid = section.querySelector('#lib-grid-' + cat.key);
            grouped[cat.key].forEach(r => {
                const card = document.createElement('div');
                card.className = 'lib-card';
                const icon = document.createElement('div');
                icon.className = 'lib-fav-icon';
                icon.textContent = cat.icon;

                const info = document.createElement('div');
                info.className = 'lib-info';

                const name = document.createElement('div');
                name.className = 'lib-name';
                name.title = r.name;
                name.textContent = r.name;
                info.appendChild(name);

                if (r.url) {
                    const url = document.createElement('div');
                    url.className = 'lib-url';
                    url.title = r.url;
                    url.textContent = r.url.replace(/^https?:\/\//, '');
                    info.appendChild(url);
                }

                if (r.desc) {
                    const desc = document.createElement('div');
                    desc.className = 'lib-desc';
                    desc.textContent = r.desc;
                    info.appendChild(desc);
                }

                const actions = document.createElement('div');
                actions.className = 'lib-card-actions';

                if (r.url) {
                    const openBtn = document.createElement('button');
                    openBtn.className = 'icon-btn';
                    openBtn.title = 'Open';
                    openBtn.innerHTML = '<i class="fa-solid fa-arrow-up-right-from-square"></i>';
                    openBtn.addEventListener('click', () => openResourceUrl(r.url));
                    actions.appendChild(openBtn);
                }

                const editBtn = document.createElement('button');
                editBtn.className = 'icon-btn';
                editBtn.title = 'Edit';
                editBtn.innerHTML = '<i class="fa-solid fa-pencil"></i>';
                editBtn.addEventListener('click', () => openAddModal(r.id));
                actions.appendChild(editBtn);

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'icon-btn red';
                deleteBtn.title = 'Delete';
                deleteBtn.innerHTML = '<i class="fa-solid fa-trash"></i>';
                deleteBtn.addEventListener('click', () => deleteResource(r.id));
                actions.appendChild(deleteBtn);

                card.appendChild(icon);
                card.appendChild(info);
                card.appendChild(actions);
                grid.appendChild(card);
            });
        });
    }

    // ===== Modal =====
    function buildCatPicker(selected) {
        const picker = document.getElementById('lib-cat-picker');
        picker.innerHTML = '';
        selectedCat = selected || 'other';
        CATEGORIES.forEach(c => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'cat-btn' + (c.key === selectedCat ? ' selected' : '');
            btn.textContent = c.icon + ' ' + c.label;
            btn.addEventListener('click', () => {
                selectedCat = c.key;
                picker.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
            });
            picker.appendChild(btn);
        });
    }

    function openAddModal(id) {
        const r = id ? resources.find(x => x.id === id) : null;
        editingId = r ? r.id : null;
        document.getElementById('lib-modal-title').textContent = r ? 'Edit Resource' : 'Add Resource';
        document.getElementById('lib-delete-btn').style.display = r ? 'inline-flex' : 'none';
        document.getElementById('lib-name').value = r ? r.name : '';
        document.getElementById('lib-url').value = r ? (r.url || '') : '';
        document.getElementById('lib-desc-input').value = r ? (r.desc || '') : '';
        buildCatPicker(r ? r.category : 'other');
        document.getElementById('lib-modal').style.display = 'flex';
        setTimeout(() => document.getElementById('lib-name').focus(), 50);
    }

    function closeLibModal() {
        document.getElementById('lib-modal').style.display = 'none';
        editingId = null;
        selectedCat = 'other';
    }

    function saveResource() {
        const name = document.getElementById('lib-name').value.trim();
        if (!name) { document.getElementById('lib-name').focus(); return; }
        const data = {
            id: editingId || ('lib-' + Date.now()),
            name,
            url: normalizeResourceUrl(document.getElementById('lib-url').value),
            desc: document.getElementById('lib-desc-input').value.trim(),
            category: selectedCat || 'other',
            created: editingId ? (resources.find(r => r.id === editingId) || {}).created || new Date().toISOString() : new Date().toISOString(),
        };
        if (editingId) {
            const idx = resources.findIndex(r => r.id === editingId);
            if (idx >= 0) resources[idx] = data;
            else resources.push(data);
        } else {
            resources.push(data);
        }
        saveResources();
        renderLibrary();
        closeLibModal();
    }

    function deleteResource(id) {
        if (!confirm('Remove this resource?')) return;
        resources = resources.filter(r => r.id !== id);
        saveResources();
        renderLibrary();
    }
    function deleteResourceConfirm() { if (editingId) { deleteResource(editingId); closeLibModal(); } }

    renderLibrary();
</script>
</body>
</html>
